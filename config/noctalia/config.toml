[bar.default]
start = [ "launcher", "group:g1", "workspaces" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "wallpaper", "mpvpaper" ]
    opacity = 1.0
    padding = 6.0

[dock]
enabled = true
layer = "overlay"
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/bitwarden"]
clear_clipboard_seconds = 30
gen_length = 16
gen_special = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/shivraj/.config/wallpapers/assets"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "noctalia/translator",
    "noctalia/mpvpaper",
    "icefish/phone-connect",
    "weinguyen/shell-command"
]

[shell]
external_ip_enabled = true
polkit_agent = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Kanagawa"
community_palette = "Cyberpunk"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "ghostty", "hyprland", "kitty", "wezterm" ]

[wallpaper]
directory = "/home/shivraj/.config/wallpapers/thumbnails"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/shivraj/.config/wallpapers/thumbnails/pixel-grasslands.png"

    [wallpaper.last]
    path = "/home/shivraj/.cache/noctalia/mpvpaper/_home_shivraj__config_wallpapers_assets_monochrome_samurai_blade_mp4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/shivraj/.cache/noctalia/mpvpaper/_home_shivraj__config_wallpapers_assets_monochrome_samurai_blade_mp4.jpg"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"
