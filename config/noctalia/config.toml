[bar.default]
start = [ "launcher", "group:g1", "workspaces" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "wallpaper", "mpvpaper" ]
    opacity = 1.0
    padding = 6.0

[dock]
enabled = true
layer = "overlay"
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[plugin_settings."noctalia/bitwarden"]
clear_clipboard_seconds = 30
gen_length = 16
gen_special = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/shivraj/.config/wallpapers/assets"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "noctalia/translator",
    "noctalia/mpvpaper",
    "icefish/phone-connect",
    "weinguyen/shell-command"
]

[shell]
external_ip_enabled = true
polkit_agent = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Kanagawa"
community_palette = "Cyberpunk"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "ghostty", "hyprland", "kitty" ]

[wallpaper]
directory = "/home/shivraj/.config/wallpapers/thumbnails"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/shivraj/.config/wallpapers/thumbnails/pixel-grasslands.png"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"
