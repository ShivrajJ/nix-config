# --- Window Settings ---
hide_window_decorations yes
remember_window_size    no
initial_window_width    120c
initial_window_height   28c
window_padding_width    0

# --- Tab Bar Settings ---
tab_bar_style           fade
show_tab_count          no
tab_bar_min_tabs        2

# --- Font Settings ---
font_family      Iosevka
font_size        12.0

# --- Performance Settings ---
repaint_delay    8
input_delay      3

# --- Mouse & Scrolling ---
touch_scroll_multiplier 3.0

# --- Color Scheme (Cyberdream) ---
# Ported directly from the Cyberdream theme specifications
background            #16161e
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #16161e
selection_background  #2c3245
selection_foreground  #ffffff

